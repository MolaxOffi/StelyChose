<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio</title><meta name="description" content="">
<style>
:root{--bg:#0d0e10;--surface:#15171a;--text:#e9e6df;--muted:#8b8f96;--border:#24272c;--accent:#8fa6c4;--accent2:#c9b79c;--radius:6px;--space:1;--fs:16px;
--body:Inter,system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:.82em;color:var(--muted)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-family:var(--mono);text-decoration:none;font-size:.9em}
nav{display:flex;gap:22px}nav a{text-decoration:none;color:var(--muted);font-size:.9em;transition:color .2s}nav a:hover,nav a.on{color:var(--text)}
#burger{display:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:6px 10px;font:inherit;cursor:pointer}
section{padding:calc(88px*var(--space)) 0;border-top:1px solid var(--border)}
section:first-child{border-top:0}
.sh{display:grid;grid-template-columns:72px 1fr;gap:16px;margin-bottom:40px;align-items:baseline}
.sh h2{font-size:1.9em;font-weight:600;letter-spacing:-.02em;line-height:1.2}.sh p{grid-column:2;color:var(--muted);max-width:60ch}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:56px;align-items:end;padding-top:calc(110px*var(--space))}
.hero h1{font-size:clamp(2.6em,7vw,5em);line-height:1.02;letter-spacing:-.035em;font-weight:650;margin:14px 0 18px}
.lead{max-width:48ch;font-size:1.1em;color:#c8c5bd}.cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 20px;border-radius:var(--radius);background:var(--accent);color:#0d0e10;text-decoration:none;font-weight:600;border:1px solid var(--accent);cursor:pointer;font:inherit;font-weight:600;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}.btn.ghost{background:none;color:var(--text);border-color:var(--border)}.btn.ghost:hover{border-color:var(--accent)}
.meta{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-family:var(--mono);font-size:.84em}
.meta div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--border)}.meta div:last-child{border:0}
.meta span:first-child{color:var(--muted)}.meta a{text-decoration:none;color:var(--accent)}.meta a:hover{text-decoration:underline}
.dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent2);margin-right:8px}.dot.on::before{background:#7fb88f}
.prose p+p{margin-top:1em}.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;margin-top:40px;border-top:1px solid var(--border)}
.blocks div{padding:20px 24px 20px 0}.blocks h3{font-size:.95em;margin-bottom:6px;color:var(--accent)}.blocks p{color:#b9b6ae}
.cat{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--border)}.cat>h3{font-size:.95em;font-weight:500;color:var(--muted);font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{display:flex;gap:10px;align-items:center;border:1px solid var(--border);padding:8px 14px;border-radius:var(--radius);background:var(--surface);transition:border-color .2s}
.chip:hover{border-color:var(--accent)}.chip i{font-style:normal;font-family:var(--mono);color:var(--accent);font-size:.85em}.chip small{color:var(--muted);display:block;font-size:.78em;line-height:1.3}
.projects{display:grid;gap:28px}.projects.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.proj{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s}
.proj:hover{border-color:var(--accent)}.proj img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-bottom:1px solid var(--border)}
.proj .b{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}.proj h3{font-size:1.15em}.proj p{color:#b9b6ae}
.tech{display:flex;flex-wrap:wrap;gap:6px}.tech span{font-family:var(--mono);font-size:.74em;color:var(--muted);border:1px solid var(--border);padding:2px 8px;border-radius:99px}
.links{display:flex;gap:16px;margin-top:auto;font-size:.9em}.links a{color:var(--accent)}
.projects.list .proj{flex-direction:row}.projects.list img{width:240px;aspect-ratio:auto;border:0;border-right:1px solid var(--border)}
.projects.featured .proj:first-child{flex-direction:row}.projects.featured .proj:first-child img{width:55%;aspect-ratio:auto;border:0;border-right:1px solid var(--border)}
.projects.featured{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.projects.featured .proj:first-child{grid-column:1/-1}
form{display:grid;gap:14px;max-width:560px;margin-top:32px}label{display:grid;gap:6px;font-size:.88em;color:var(--muted)}
input,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:var(--radius);font:inherit}
input:focus,textarea:focus{border-color:var(--accent);outline:0}.hp{position:absolute;left:-9999px}
footer{border-top:1px solid var(--border);padding:28px 0;color:var(--muted)}
.rv{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
.noanim *,.noanim{transition:none!important;scroll-behavior:auto!important}.noanim .rv{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:36px}.cat{grid-template-columns:1fr;gap:12px}.sh{grid-template-columns:1fr;gap:4px}.sh p{grid-column:1}
#burger{display:block}nav{display:none;position:absolute;top:56px;left:0;right:0;flex-direction:column;background:var(--bg);padding:16px 24px;border-bottom:1px solid var(--border)}nav.open{display:flex}
.projects.list .proj,.projects.featured .proj:first-child{flex-direction:column}.projects.list img,.projects.featured .proj:first-child img{width:100%;aspect-ratio:16/9;border:0;border-bottom:1px solid var(--border)}}
</style></head><body>
<header><div class="wrap"><a class="logo" href="#top" id="logo"></a><button id="burger" aria-label="Menu" aria-expanded="false">Menu</button><nav id="nav" aria-label="Navigation principale"></nav></div></header>
<main id="main"></main><footer><div class="wrap mono" id="foot"></div></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>u&&!/^\s*(javascript|data|vbscript):/i.test(u)?esc(u):'#',paras=t=>String(t||'').split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
const FONTS={sans:'Inter,system-ui,-apple-system,"Segoe UI",sans-serif',serif:'Georgia,"Times New Roman",serif',mono:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'};
let C;
function applyTheme(t){const m={bg:t.bg,surface:t.surface,text:t.text,muted:t.muted,border:t.border,accent:t.accent,accent2:t.accent2},r=document.documentElement.style;
 for(const k in m)r.setProperty('--'+k,m[k]);r.setProperty('--radius',t.radius+'px');r.setProperty('--space',t.space);r.setProperty('--fs',t.fontSize+'px');
 r.setProperty('--body',FONTS[t.fontBody]||FONTS.sans);r.setProperty('--mono',FONTS[t.fontMono]||FONTS.mono);document.body.classList.toggle('noanim',!t.animations)}
const head=(s,n)=>`<div class="sh rv"><span class="mono">${String(n).padStart(2,'0')}</span><h2>${esc(s.title)}</h2>${s.body&&!['about','text'].includes(s.type)?`<p>${esc(s.body)}</p>`:''}</div>`;
const R={
 home:(s,n,c)=>{const t=c.site;return`<section id="${esc(s.id)}" class="wrap hero"><div class="rv"><span class="mono">${esc(t.location)}</span><h1>${esc(t.name)}</h1><p class="mono">${esc(t.role)}</p><p class="lead" style="margin-top:14px">${esc(t.bio)}</p>
 <div class="cta"><a class="btn" href="#${esc(c.sections.find(x=>x.type==='projects'&&x.visible)?.id||'')}">Voir les projets</a><a class="btn ghost" href="#${esc(c.sections.find(x=>x.type==='contact'&&x.visible)?.id||'')}">Me contacter</a></div></div>
 <aside class="meta rv"><div><span>statut</span><span class="dot ${t.available?'on':''}">${esc(t.available?t.availableText:'Indisponible')}</span></div>${t.email?`<div><span>mail</span><a href="mailto:${esc(t.email)}">${esc(t.email)}</a></div>`:''}
 ${(t.socials||[]).map(x=>`<div><span>${esc(x.label)}</span><a href="${url(x.url)}" rel="noopener" target="_blank">${esc(x.url.replace(/^https?:\/\/(www\.)?/,''))}</a></div>`).join('')}</aside></section>`},
 about:(s,n)=>`<section id="${esc(s.id)}"><div class="wrap">${head(s,n)}<div class="prose rv" style="max-width:64ch">${paras(s.body)}</div><div class="blocks rv">${(s.blocks||[]).map(b=>`<div><h3>${esc(b.label)}</h3><p>${esc(b.text)}</p></div>`).join('')}</div></div></section>`,
 skills:(s,n,c)=>{const cats=[...new Set(c.skills.map(k=>k.cat||'Autres'))];return`<section id="${esc(s.id)}"><div class="wrap">${head(s,n)}${cats.map(k=>`<div class="cat rv"><h3>${esc(k)}</h3><div class="chips">${c.skills.filter(x=>(x.cat||'Autres')===k).map(x=>`<div class="chip">${x.icon?`<i aria-hidden="true">${esc(x.icon)}</i>`:''}<div>${esc(x.name)}${x.level?` <span class="mono">${esc(x.level)}</span>`:''}${x.desc?`<small>${esc(x.desc)}</small>`:''}</div></div>`).join('')}</div></div>`).join('')}</div></section>`},
 projects:(s,n,c)=>`<section id="${esc(s.id)}"><div class="wrap">${head(s,n)}<div class="projects ${esc(s.layout||'grid')}">${c.projects.filter(p=>p.published!==false).map(p=>`<article class="proj rv">${p.image?`<img src="${url(p.image)}" alt="Capture de ${esc(p.name)}" loading="lazy">`:''}<div class="b"><div class="mono">${esc([p.status,p.date].filter(Boolean).join(' – '))}</div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
 <div class="tech">${(p.tech||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="links">${p.url?`<a href="${url(p.url)}" target="_blank" rel="noopener">Voir le projet</a>`:''}${p.github?`<a href="${url(p.github)}" target="_blank" rel="noopener">Code source</a>`:''}</div></div></article>`).join('')}</div></div></section>`,
 contact:(s,n,c)=>`<section id="${esc(s.id)}"><div class="wrap">${head(s,n)}<div class="prose rv"><p>${esc(s.body)}</p>${c.site.email?`<p><a href="mailto:${esc(c.site.email)}">${esc(c.site.email)}</a></p>`:''}</div>
 ${s.form&&c.site.formAction?`<form id="cf" class="rv"><label>Nom<input name="name" required maxlength="100" autocomplete="name"></label><label>E-mail<input name="email" type="email" required maxlength="150" autocomplete="email"></label>
 <label>Message<textarea name="body" rows="5" required maxlength="4000"></textarea></label><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" type="submit">Envoyer le message</button><p class="mono" id="cs" role="status"></p></form>`:''}</div></section>`};
R.text=R.about;
function render(c){C=c;applyTheme(c.theme);const t=c.site;document.title=t.seoTitle||t.name;document.querySelector('meta[name=description]').content=t.seoDescription||'';
 $('#logo').textContent=t.name;$('#foot').textContent='© '+new Date().getFullYear()+' '+t.name;let n=0;const vis=c.sections.filter(s=>s.visible&&R[s.type]);
 $('#nav').innerHTML=vis.map(s=>`<a href="#${esc(s.id)}">${esc(s.nav||s.title)}</a>`).join('');
 $('#main').innerHTML=vis.map(s=>R[s.type](s,s.type==='home'?0:++n,c)).join('');observe();bindForm()}
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.rv').forEach(e=>io.observe(e));
 const links=[...document.querySelectorAll('nav a')],so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});document.querySelectorAll('main>section').forEach(s=>so.observe(s))}
function bindForm(){const f=$('#cf');if(!f)return;f.onsubmit=async e=>{e.preventDefault();const o=$('#cs');
 try{const r=await fetch(C.site.formAction,{method:'POST',headers:{Accept:'application/json'},body:new FormData(f)});if(!r.ok)throw new Error('erreur '+r.status);o.textContent='Message envoyé, merci !';f.reset()}catch(x){o.textContent='Échec : '+x.message}}}
$('#burger').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};$('#nav').onclick=()=>$('#nav').classList.remove('open');
fetch('content.json').then(r=>r.json()).then(render).catch(e=>{$('#main').innerHTML='<p class="wrap">Impossible de charger content.json : '+esc(e.message)+'</p>'});
</script></body></html>
